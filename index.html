<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifica Stato Lavori - P-Technology</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
      margin: 0;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    h2 {
      color: #004080;
      margin-top: 10px;
      font-size: 1.5em;
      text-align: center;
    }
    input, button {
      padding: 12px;
      font-size: 1em;
      margin-top: 10px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background-color: #004080;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0066cc;
    }
    #risultato {
      margin-top: 20px;
      font-size: 1.1em;
      font-weight: bold;
      text-align: center;
    }
    img.logo {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 15px auto;
    }
    @media (max-width: 480px) {
      body {
        padding: 15px;
      }
      h2 {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>

  <img src="logo-ptechnology.png" alt="Logo P-Technology" class="logo">
  <h2>🔧 Verifica Stato Avanzamento Lavori</h2>

  <p style="text-align: center;">Inserisci il codice (es. <strong>RP00014</strong>):</p>
  <input type="text" id="codiceInput" placeholder="Es. RP00014">
  <button onclick="verificaStato()">Verifica</button>

  <div id="risultato"></div>

  <script>
    async function verificaStato() {
      const codice = document.getElementById("codiceInput").value.trim();
      const risultato = document.getElementById("risultato");
      risultato.textContent = "🔄 Verifica in corso...";

      const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQs3VZOGDvbdTu0QEWKGrbza_SMxDSmIqpf4PRQqK4CejCBsKEH9eoVK-AMXLagfUK01SyJCkPclgvx/pub?gid=0&single=true&output=csv";
      try {
        const res = await fetch(csvUrl);
        const text = await res.text();
        const righe = text.split('\n').map(r => r.split(','));

        let trovato = false;
        for (let i = 1; i < righe.length; i++) {
          const [cod, stato] = righe[i];
          if (cod && cod.trim() === codice) {
            risultato.textContent = `✅ Stato attuale: ${stato.trim()}`;
            trovato = true;
            break;
          }
        }
        if (!trovato) {
          risultato.textContent = "⚠️ Codice non trovato nel foglio CSV.";
        }
      } catch (err) {
        risultato.textContent = "❌ Errore nel caricamento del CSV.";
      }
    }
  </script>

</body>
</html>
