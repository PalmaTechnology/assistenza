<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Verifica Stato Lavori</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 30px;
      max-width: 600px;
      margin: auto;
    }
    h2 {
      color: #004080;
    }
    input, select, button {
      padding: 12px;
      font-size: 16px;
      margin-top: 10px;
      width: 100%;
    }
    button {
      background-color: #004080;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0066cc;
    }
    #risultato {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>🔧 Verifica Stato Avanzamento Lavori</h2>

  <label for="fonte">Sorgente dati:</label>
  <select id="fonte">
    <option value="api">Web App (API)</option>
    <option value="csv">Foglio Google (CSV)</option>
  </select>

  <p>Inserisci il codice (es. <strong>RP00014</strong>):</p>
  <input type="text" id="codiceInput" placeholder="Es. RP00014">
  <button onclick="verificaStato()">Verifica</button>

  <div id="risultato"></div>

  <script>
    async function verificaStato() {
      const codice = document.getElementById("codiceInput").value.trim();
      const fonte = document.getElementById("fonte").value;
      const risultato = document.getElementById("risultato");
      risultato.textContent = "🔄 Verifica in corso...";

      if (fonte === "api") {
        const apiUrl = "https://script.google.com/macros/s/AKfycbzb8xpFt0RUBs2kMWlgOSqdVD_3Ad0q6hDIa0D3BJEBCVbUGXuhsaUOl7ZzGewQtM-t/exec";
        try {
          const res = await fetch(`${apiUrl}?codice=${encodeURIComponent(codice)}`);
          const data = await res.json();
          if (data.stato && data.stato !== "Codice non trovato") {
            risultato.textContent = `✅ Stato attuale: ${data.stato}`;
          } else {
            risultato.textContent = "⚠️ Codice non trovato.";
          }
        } catch (err) {
          risultato.textContent = "❌ Errore nella connessione con la Web App.";
        }

      } else if (fonte === "csv") {
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQs3VZOGDvbdTu0QEWKGrbza_SMxDSmIqpf4PRQqK4CejCBsKEH9eoVK-AMXLagfUK01SyJCkPclgvx/pub?gid=0&single=true&output=csv";
        try {
          const res = await fetch(csvUrl);
          const text = await res.text();
          const righe = text.split('\n').map(r => r.split(','));

          let trovato = false;
          for (let i = 1; i < righe.length; i++) {
            const [cod, stato] = righe[i];
            if (cod && cod.trim() === codice) {
              risultato.textContent = `✅ Stato attuale: ${stato.trim()}`;
              trovato = true;
              break;
            }
          }
          if (!trovato) {
            risultato.textContent = "⚠️ Codice non trovato nel foglio CSV.";
          }
        } catch (err) {
          risultato.textContent = "❌ Errore nel caricamento del CSV.";
        }
      }
    }
  </script>

</body>
</html>
